name: CI

on:
  push:
  pull_request:

jobs:
  check:
    name: vet + gofmt + test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # gofmt must not need to re-flow any tracked source (issue 11).
      - name: gofmt check
        run: make fmt-check

      - name: go vet
        run: make vet

      - name: go test
        run: make test

      # Emit a coverage profile and surface it as an action artifact (issue 11).
      - name: Generate coverage
        run: make cover

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage.out
          path: coverage.out
